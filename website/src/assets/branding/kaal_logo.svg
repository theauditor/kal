<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="500" height="600">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cinzel+Decorative&display=swap');
    </style>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  style="stop-color:#c9a84c;stop-opacity:1"/>
      <stop offset="40%" style="stop-color:#f0d080;stop-opacity:1"/>
      <stop offset="70%" style="stop-color:#c9a84c;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#a07830;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  style="stop-color:#e8c860;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#c9a84c;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#a07830;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="600" fill="#0a0a0a"/>

  <!-- ============ MANDALA (centred at 250,210) ============ -->
  <circle cx="250" cy="210" r="155" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="2,5" opacity="0.6"/>
  <circle cx="250" cy="210" r="145" fill="none" stroke="url(#goldGrad)" stroke-width="0.4" stroke-dasharray="1,4" opacity="0.35"/>
  <ellipse cx="250" cy="210" rx="118" ry="112" fill="none" stroke="url(#goldGrad)" stroke-width="0.6" opacity="0.45"/>
  <ellipse cx="250" cy="210" rx="100" ry="96"  fill="none" stroke="url(#goldGrad)" stroke-width="0.6" opacity="0.45"/>
  <ellipse cx="250" cy="210" rx="82"  ry="79"  fill="none" stroke="url(#goldGrad)" stroke-width="0.7" opacity="0.5"/>
  <ellipse cx="250" cy="210" rx="64"  ry="62"  fill="none" stroke="url(#goldGrad)" stroke-width="0.7" opacity="0.55"/>
  <ellipse cx="250" cy="210" rx="46"  ry="45"  fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.6"/>

  <!-- Wavy ripple paths -->
  <path d="M 130,210 Q 145,190 165,205 Q 185,220 205,200 Q 225,180 250,195 Q 275,210 295,195 Q 315,180 335,200 Q 355,220 370,205 Q 380,198 390,210"
        fill="none" stroke="url(#goldGrad)" stroke-width="0.7" opacity="0.4"/>
  <path d="M 130,210 Q 145,230 165,215 Q 185,200 205,220 Q 225,240 250,225 Q 275,210 295,225 Q 315,240 335,220 Q 355,200 370,215 Q 382,224 390,210"
        fill="none" stroke="url(#goldGrad)" stroke-width="0.7" opacity="0.4"/>

  <!-- Cross axis lines -->
  <line x1="250" y1="55"  x2="250" y2="365" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.7"/>
  <line x1="95"  y1="210" x2="405" y2="210" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.7"/>

  <!-- Axis dots -->
  <circle cx="250" cy="58"  r="2.5" fill="url(#goldGrad)" filter="url(#glow)"/>
  <circle cx="250" cy="85"  r="1.8" fill="url(#goldGrad)" opacity="0.8"/>
  <circle cx="250" cy="362" r="2.5" fill="url(#goldGrad)" filter="url(#glow)"/>
  <circle cx="250" cy="335" r="1.8" fill="url(#goldGrad)" opacity="0.8"/>
  <circle cx="98"  cy="210" r="2.5" fill="url(#goldGrad)" filter="url(#glow)"/>
  <circle cx="402" cy="210" r="2.5" fill="url(#goldGrad)" filter="url(#glow)"/>
  <circle cx="250" cy="370" r="3"   fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.5"/>

  <!-- Sound wave left -->
  <path d="M 98,210 L 118,210 L 122,195 L 127,225 L 132,190 L 137,232 L 142,185 L 147,235 L 152,190 L 157,228 L 162,198 L 167,220 L 172,206 L 177,214 L 180,210 L 210,210"
        fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)" opacity="0.9"/>

  <!-- Sound wave right -->
  <path d="M 290,210 L 320,210 L 323,214 L 328,206 L 333,220 L 338,198 L 343,228 L 348,190 L 353,235 L 358,185 L 363,232 L 368,190 L 373,225 L 378,195 L 382,210 L 402,210"
        fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)" opacity="0.9"/>

  <!-- ============ DAMRU ============ -->
  <!-- Top triangle: base y=152, tip y=222 -->
  <polygon points="222,152 278,152 250,222"
           fill="#1c1408" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Bottom triangle: base y=268, tip y=198 -->
  <polygon points="222,268 278,268 250,198"
           fill="#1c1408" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Cross-over: top triangle lower portion redrawn in front -->
  <polygon points="233,198 267,198 250,222" fill="#1c1408" stroke="none"/>
  <line x1="233" y1="198" x2="250" y2="222" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="267" y1="198" x2="250" y2="222" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Drum face caps -->
  <ellipse cx="250" cy="152" rx="28" ry="7" fill="#251c0a" stroke="url(#goldGrad)" stroke-width="1.5" filter="url(#glow)"/>
  <ellipse cx="250" cy="268" rx="28" ry="7" fill="#251c0a" stroke="url(#goldGrad)" stroke-width="1.5" filter="url(#glow)"/>
  <!-- Tension lines top -->
  <line x1="236" y1="158" x2="248" y2="214" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.35"/>
  <line x1="250" y1="159" x2="250" y2="216" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.35"/>
  <line x1="264" y1="158" x2="252" y2="214" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.35"/>
  <!-- Tension lines bottom -->
  <line x1="236" y1="262" x2="248" y2="206" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.35"/>
  <line x1="250" y1="261" x2="250" y2="204" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.35"/>
  <line x1="264" y1="262" x2="252" y2="206" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.35"/>
  <!-- Centre knot -->
  <circle cx="250" cy="210" r="6.5" fill="#0a0a0a" stroke="url(#goldGrad)" stroke-width="2" filter="url(#glow)"/>
  <circle cx="250" cy="210" r="2.8" fill="url(#goldGrad)" filter="url(#glow)"/>
  <!-- Rope + bead upper-left -->
  <path d="M 245,205 Q 236,195 227,186 Q 223,181 220,176"
        fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round" opacity="0.95"/>
  <circle cx="219" cy="174" r="3.5" fill="url(#goldGrad)" filter="url(#glow)"/>
  <circle cx="219" cy="174" r="1.8" fill="#0a0a0a"/>
  <!-- Rope + bead lower-right -->
  <path d="M 255,215 Q 264,225 273,234 Q 277,239 280,244"
        fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round" opacity="0.95"/>
  <circle cx="281" cy="246" r="3.5" fill="url(#goldGrad)" filter="url(#glow)"/>
  <circle cx="281" cy="246" r="1.8" fill="#0a0a0a"/>
  <!-- Spine dots -->
  <circle cx="250" cy="138" r="2.5" fill="url(#goldGrad)" filter="url(#glow)"/>
  <circle cx="250" cy="282" r="2.5" fill="url(#goldGrad)" filter="url(#glow)"/>

  <!-- ============ TEXT ============ -->

  <!-- KĀL -->
  <text x="250" y="438"
        text-anchor="middle"
        font-family="Cinzel Decorative, Cinzel, serif"
        font-size="72" font-weight="400" letter-spacing="16"
        fill="url(#goldGrad2)" filter="url(#softglow)">K&#256;L</text>

  <!-- Rule -->
  <line x1="105" y1="452" x2="395" y2="452" stroke="url(#goldGrad)" stroke-width="0.6" opacity="0.5"/>

  <!-- LIVE PERFORMANCE STATION -->
  <text x="250" y="470"
        text-anchor="middle"
        font-family="Cinzel, serif"
        font-size="9" letter-spacing="7"
        fill="url(#goldGrad)" opacity="0.85">LIVE PERFORMANCE STATION</text>

  <!-- LPS -->
  <text x="250" y="500"
        text-anchor="middle"
        font-family="Cinzel, serif"
        font-size="20" letter-spacing="12"
        fill="url(#goldGrad)" opacity="0.65" filter="url(#glow)">LPS</text>

</svg>
